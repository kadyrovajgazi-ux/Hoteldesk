n\u003cmain class=\"main\"\u003e\n  \u003cheader class=\"topbar\"\u003e\n    \u003cdiv\u003e\u003cdiv class=\"eyebrow\"\u003eFront office · Рабочая панель\u003c/div\u003e\u003cdiv class=\"top-title\" id=\"topTitle\"\u003eДобро пожаловать\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv class=\"top-actions\"\u003e\u003cdiv class=\"date-pill\" id=\"todayPill\"\u003eСегодня\u003c/div\u003e\u003cdiv class=\"avatar\"\u003eHD\u003c/div\u003e\u003c/div\u003e\n  \u003c/header\u003e\n  \u003cdiv class=\"content\"\u003e\n    \u003csection class=\"page active\" id=\"page-home\"\u003e\n      \u003cdiv class=\"page-heading\"\u003e\u003cdiv\u003e\u003ch1\u003eДобро пожаловать\u003c/h1\u003e\u003cp\u003eВсё необходимое для спокойной и организованной смены — в одном месте.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton class=\"btn btn-gold\" data-go=\"report\"\u003e＋ Создать передачу смены\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"grid stats\"\u003e\n        \u003cdiv class=\"stat-card\"\u003e\u003cdiv class=\"stat-top\"\u003eАктивные задачи \u003cspan class=\"stat-icon\"\u003e✓\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"stat-value\" id=\"statTasks\"\u003e0\u003c/div\u003e\u003cdiv class=\"stat-note\"\u003eОжидают выполнения\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"stat-card\"\u003e\u003cdiv class=\"stat-top\"\u003eОтчёты в архиве \u003cspan class=\"stat-icon\"\u003e▤\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"stat-value\" id=\"statReports\"\u003e0\u003c/div\u003e\u003cdiv class=\"stat-note\"\u003eСохранено на устройстве\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"stat-card\"\u003e\u003cdiv class=\"stat-top\"\u003eЧек-лист смены \u003cspan class=\"stat-icon\"\u003e☑\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"stat-value\" id=\"statChecklist\"\u003e0%\u003c/div\u003e\u003cdiv class=\"stat-note\"\u003eОтмечено пунктов сегодня\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"stat-card\"\u003e\u003cdiv class=\"stat-top\"\u003eЧерновик отчёта \u003cspan class=\"stat-icon\"\u003e✎\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"stat-value\" id=\"statDraft\"\u003e—\u003c/div\u003e\u003cdiv class=\"stat-note\"\u003eАвтосохранение включено\u003c/div\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"grid dashboard-grid\"\u003e\n        \u003cdiv\u003e\n          \u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-head\"\u003e\u003cdiv\u003e\u003ch2 class=\"card-title\"\u003eБыстрый доступ\u003c/h2\u003e\u003cdiv class=\"card-sub\"\u003eЧасто используемые разделы\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n            \u003cdiv class=\"quick-grid\"\u003e\n              \u003cbutton class=\"quick\" data-go=\"report\"\u003e\u003cdiv class=\"quick-icon\"\u003e📋\u003c/div\u003e\u003cstrong\u003eПередать смену\u003c/strong\u003e\u003cspan\u003eЗафиксировать важные события\u003c/span\u003e\u003c/button\u003e\n              \u003cbutton class=\"quick\" data-go=\"tasks\"\u003e\u003cdiv class=\"quick-icon\"\u003e🗂️\u003c/div\u003e\u003cstrong\u003eДобавить задачу\u003c/strong\u003e\u003cspan\u003eНе забыть о незавершённом\u003c/span\u003e\u003c/button\u003e\n              \u003cbutton class=\"quick\" data-go=\"guests\"\u003e\u003cdiv class=\"quick-icon\"\u003e💬\u003c/div\u003e\u003cstrong\u003eОтветить гостю\u003c/strong\u003e\u003cspan\u003eПодготовить сообщение\u003c/span\u003e\u003c/button\u003e\n              \u003cbutton class=\"quick\" data-go=\"checklist\"\u003e\u003cdiv class=\"quick-icon\"\u003e☑️\u003c/div\u003e\u003cstrong\u003eПроверить смену\u003c/strong\u003e\u003cspan\u003eПройти обязательные пункты\u003c/span\u003e\u003c/button\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-head\"\u003e\u003cdiv\u003e\u003ch2 class=\"card-title\"\u003eПоследние отчёты\u003c/h2\u003e\u003cdiv class=\"card-sub\"\u003eНедавно сохранённые передачи смены\u003c/div\u003e\u003c/div\u003e\u003cbutton class=\"link-btn\" data-go=\"archive\"\u003eВесь архив →\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"homeReports\" class=\"activity-list\"\u003e\u003cdiv class=\"empty\"\u003eПока нет сохранённых отчётов\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv\u003e\n          \u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-head\"\u003e\u003cdiv\u003e\u003ch2 class=\"card-title\"\u003eНезавершённые задачи\u003c/h2\u003e\u003cdiv class=\"card-sub\"\u003eЧто требует внимания\u003c/div\u003e\u003c/div\u003e\u003cbutton class=\"link-btn\" data-go=\"tasks\"\u003eВсе задачи →\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"homeTasks\" class=\"activity-list\"\u003e\u003cdiv class=\"empty\"\u003eАктивных задач нет\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n          \u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-head\"\u003e\u003cdiv\u003e\u003ch2 class=\"card-title\"\u003eПолезная заметка\u003c/h2\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"notice\" style=\"margin:0\"\u003eПеред завершением смены зафиксируйте открытые вопросы, договорённости с гостями, ожидаемые заезды и задачи для следующего администратора.\u003c/div\u003e\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"page\" id=\"page-report\"\u003e\n      \u003cdiv class=\"page-heading\"\u003e\u003cdiv\u003e\u003ch1\u003eПередача смены\u003c/h1\u003e\u003cp\u003eЗаполните основные сведения — приложение подготовит аккуратный отчёт на русском языке.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton class=\"btn btn-outline\" id=\"clearReport\"\u003eОчистить форму\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"notice\"\u003eЧерновик сохраняется автоматически в браузере на этом устройстве. Чтобы передать отчёт коллеге, сформируйте его и скопируйте текст или сохраните в архив.\u003c/div\u003e\n      \u003cdiv class=\"card\"\u003e\n        \u003cdiv class=\"form-grid\"\u003e\n          \u003cdiv class=\"field\"\u003e\u003clabel for=\"reportDate\"\u003eДата смены\u003c/label\u003e\u003cinput type=\"date\" id=\"reportDate\"\u003e\u003c/div\u003e\n          \u003cdiv class=\"field\"\u003e\u003clabel for=\"shiftType\"\u003eСмена\u003c/label\u003e\u003cselect id=\"shiftType\"\u003e\u003coption\u003eУтренняя смена\u003c/option\u003e\u003coption\u003eДневная смена\u003c/option\u003e\u003coption\u003eВечерняя смена\u003c/option\u003e\u003coption\u003eНочная смена\u003c/option\u003e\u003coption\u003eДругая смена\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n          \u003cdiv class=\"field\"\u003e\u003clabel for=\"fromName\"\u003eСотрудник, передающий смену\u003c/label\u003e\u003cinput id=\"fromName\" placeholder=\"Имя администратора\"\u003e\u003c/div\u003e\n          \u003cdiv class=\"field\"\u003e\u003clabel for=\"toName\"\u003eСотрудник, принимающий смену\u003c/label\u003e\u003cinput id=\"toName\" placeholder=\"Имя следующего администратора\"\u003e\u003c/div\u003e\n          \u003cdiv class=\"field\"\u003e\u003clabel for=\"occupancy\"\u003eЗагрузка / занятость\u003c/label\u003e\u003cinput id=\"occupancy\" placeholder=\"Например: 78%, 42 номера\"\u003e\u003c/div\u003e\n          \u003cdiv class=\"field\"\u003e\u003clabel for=\"arrivals\"\u003eОжидаемые заезды\u003c/label\u003e\u003cinput id=\"arrivals\" placeholder=\"Количество, группы, VIP-гости\"\u003e\u003c/div\u003e\n          \u003cdiv class=\"field full\"\u003e\u003clabel for=\"important\"\u003eВажная информация\u003c/label\u003e\u003ctextarea id=\"important\" placeholder=\"События смены, договорённости, просьбы гостей, особые обстоятельства…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n          \u003cdiv class=\"field full\"\u003e\u003clabel for=\"guestIssues\"\u003eВопросы и обращения гостей\u003c/label\u003e\u003ctextarea id=\"guestIssues\" placeholder=\"Номер комнаты (если уместно), суть обращения, что уже сделано и что нужно продолжить…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n          \u003cdiv class=\"field full\"\u003e\u003clabel for=\"pending\"\u003eНезавершённые задачи для следующей смены\u003c/label\u003e\u003ctextarea id=\"pending\" placeholder=\"Что необходимо сделать, проверить или проконтролировать…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n          \u003cdiv class=\"field full\"\u003e\u003clabel for=\"completedTasks\"\u003eУже выполненные задачи за смену\u003c/label\u003e\u003ctextarea id=\"completedTasks\" placeholder=\"Что удалось выполнить за эту смену…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n          \u003cdiv class=\"field full\"\u003e\u003clabel for=\"payments\"\u003eОплаты, документы и прочие нюансы\u003c/label\u003e\u003ctextarea id=\"payments\" placeholder=\"Ожидаемые оплаты, счета, документы, забытые вещи и другое…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n          \u003cdiv class=\"field full\"\u003e\u003clabel for=\"otherNotes\"\u003eДополнительные заметки\u003c/label\u003e\u003ctextarea id=\"otherNotes\" placeholder=\"Любая другая информация для коллег\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"form-actions\"\u003e\u003cbutton class=\"btn btn-primary\" id=\"generateReport\"\u003e✦ Сформировать отчёт\u003c/button\u003e\u003cbutton class=\"btn btn-gold\" id=\"saveReport\"\u003eСохранить в архив\u003c/button\u003e\u003cbutton class=\"btn btn-outline\" id=\"copyReport\"\u003eКопировать текст\u003c/button\u003e\u003cbutton class=\"btn btn-outline\" id=\"printReport\"\u003eПечать / PDF\u003c/button\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-head\"\u003e\u003cdiv\u003e\u003ch2 class=\"card-title\"\u003eПредварительный просмотр\u003c/h2\u003e\u003cdiv class=\"card-sub\"\u003eИменно этот текст можно передать следующему администратору\u003c/div\u003e\u003c/div\u003e\u003cspan class=\"badge\" id=\"reportStatus\"\u003eЧерновик\u003c/span\u003e\u003c/div\u003e\u003cdiv id=\"reportPreview\" class=\"report-preview\"\u003eЗаполните форму и нажмите «Сформировать отчёт».\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"page\" id=\"page-tasks\"\u003e\n      \u003cdiv class=\"page-heading\"\u003e\u003cdiv\u003e\u003ch1\u003eЗадачи\u003c/h1\u003e\u003cp\u003eСписок дел, которые нужно выполнить или передать следующей смене.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"card\"\u003e\n        \u003cdiv class=\"form-grid\"\u003e\n          \u003cdiv class=\"field full\"\u003e\u003clabel for=\"taskTitle\"\u003eЗадача\u003c/label\u003e\u003cinput id=\"taskTitle\" placeholder=\"Например: проверить оплату по счёту 204\"\u003e\u003c/div\u003e\n          \u003cdiv class=\"field\"\u003e\u003clabel for=\"taskPriority\"\u003eПриоритет\u003c/label\u003e\u003cselect id=\"taskPriority\"\u003e\u003coption value=\"high\"\u003eВысокий\u003c/option\u003e\u003coption value=\"medium\" selected\u003eСредний\u003c/option\u003e\u003coption value=\"low\"\u003eНизкий\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n          \u003cdiv class=\"field\"\u003e\u003clabel for=\"taskDue\"\u003eСрок / время\u003c/label\u003e\u003cinput id=\"taskDue\" placeholder=\"Например: до 18:00 или завтра\"\u003e\u003c/div\u003e\n          \u003cdiv class=\"field full\"\u003e\u003clabel for=\"taskNote\"\u003eКомментарий (необязательно)\u003c/label\u003e\u003ctextarea id=\"taskNote\" style=\"min-height:70px\" placeholder=\"Подробности, номер комнаты, кому сообщить…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"form-actions\"\u003e\u003cbutton class=\"btn btn-primary\" id=\"addTask\"\u003e＋ Добавить задачу\u003c/button\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"card\"\u003e\u003cdiv class=\"filter-row\" id=\"taskFilters\"\u003e\u003cbutton class=\"filter-btn active\" data-filter=\"all\"\u003eВсе\u003c/button\u003e\u003cbutton class=\"filter-btn\" data-filter=\"active\"\u003eАктивные\u003c/button\u003e\u003cbutton class=\"filter-btn\" data-filter=\"done\"\u003eВыполненные\u003c/button\u003e\u003cbutton class=\"filter-btn\" data-filter=\"high\"\u003eВысокий приоритет\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"taskList\" class=\"task-list\"\u003e\u003cdiv class=\"empty\"\u003eПока задач нет — добавьте первую выше.\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"page\" id=\"page-templates\"\u003e\n      \u003cdiv class=\"page-heading\"\u003e\u003cdiv\u003e\u003ch1\u003eШаблоны ситуаций\u003c/h1\u003e\u003cp\u003eКороткие заготовки для внутренних заметок и типичных рабочих случаев.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"template-list\" id=\"templateList\"\u003e\u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"page\" id=\"page-guests\"\u003e\n      \u003cdiv class=\"page-heading\"\u003e\u003cdiv\u003e\u003ch1\u003eПомощник по гостям\u003c/h1\u003e\u003cp\u003eПодготовьте вежливое сообщение гостю на русском языке и скопируйте его для отправки.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"grid two-col\"\u003e\n        \u003cdiv class=\"card\"\u003e\n          \u003cdiv class=\"card-head\"\u003e\u003cdiv\u003e\u003ch2 class=\"card-title\"\u003eСоздать сообщение\u003c/h2\u003e\u003cdiv class=\"card-sub\"\u003eВыберите ситуацию и заполните детали\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n          \u003cdiv class=\"form-grid\"\u003e\n            \u003cdiv class=\"field full\"\u003e\u003clabel for=\"guestScenario\"\u003eСитуация\u003c/label\u003e\u003cselect id=\"guestScenario\"\u003e\u003coption value=\"custom\"\u003eСвоё сообщение\u003c/option\u003e\u003coption value=\"cancel\"\u003eОтмена рейса / невозможность заезда\u003c/option\u003e\u003coption value=\"taxi\"\u003eЗаказ такси\u003c/option\u003e\u003coption value=\"early\"\u003eРанний заезд\u003c/option\u003e\u003coption value=\"late\"\u003eПоздний выезд\u003c/option\u003e\u003coption value=\"breakfast\"\u003eЗавтрак\u003c/option\u003e\u003coption value=\"request\"\u003eПолучен запрос гостя\u003c/option\u003e\u003coption value=\"apology\"\u003eИзвинение за неудобства\u003c/option\u003e\u003coption value=\"thanks\"\u003eБлагодарность за проживание\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\n            \u003cdiv class=\"field\"\u003e\u003clabel for=\"guestName\"\u003eИмя гостя (необязательно)\u003c/label\u003e\u003cinput id=\"guestName\" placeholder=\"Например: Анна\"\u003e\u003c/div\u003e\n            \u003cdiv class=\"field\"\u003e\u003clabel for=\"hotelDetail\"\u003eДетали / условия\u003c/label\u003e\u003cinput id=\"hotelDetail\" placeholder=\"Время, сумма, условия…\"\u003e\u003c/div\u003e\n            \u003cdiv class=\"field full\"\u003e\u003clabel for=\"guestCustom\"\u003eДополнительная информация\u003c/label\u003e\u003ctextarea id=\"guestCustom\" placeholder=\"Укажите детали, которые нужно включить в сообщение\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"form-actions\"\u003e\u003cbutton class=\"btn btn-primary\" id=\"makeGuestMessage\"\u003eПодготовить сообщение\u003c/button\u003e\u003cbutton class=\"btn btn-outline\" id=\"copyGuestMessage\"\u003eКопировать\u003c/button\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-head\"\u003e\u003cdiv\u003e\u003ch2 class=\"card-title\"\u003eТекст сообщения\u003c/h2\u003e\u003cdiv class=\"card-sub\"\u003eПроверьте детали перед отправкой\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ctextarea id=\"guestMessage\" style=\"min-height:300px\" placeholder=\"Здесь появится готовое сообщение…\"\u003e\u003c/textarea\u003e\u003cdiv class=\"small-note\" style=\"margin-top:9px\"\u003eПеред отправкой проверьте имя, даты, суммы и условия бронирования.\u003c/div\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"page\" id=\"page-checklist\"\u003e\n      \u003cdiv class=\"page-heading\"\u003e\u003cdiv\u003e\u003ch1\u003eЧек-лист смены\u003c/h1\u003e\u003cp\u003eОтмечайте выполненные пункты по мере проверки. Прогресс сохраняется на этом устройстве.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton class=\"btn btn-outline\" id=\"resetChecklist\"\u003eСбросить отметки\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-head\"\u003e\u003cdiv\u003e\u003ch2 class=\"card-title\"\u003eКонтроль смены\u003c/h2\u003e\u003cdiv class=\"card-sub\" id=\"checkProgressText\"\u003e0 из 0 пунктов выполнено\u003c/div\u003e\u003c/div\u003e\u003cspan class=\"badge\" id=\"checkPercent\"\u003e0%\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"progress-wrap\"\u003e\u003cdiv class=\"progress-bar\" id=\"checkProgressBar\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"grid two-col\"\u003e\u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-head\"\u003e\u003ch2 class=\"card-title\"\u003eВ начале смены\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\"checklist\" id=\"checkStart\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-head\"\u003e\u003ch2 class=\"card-title\"\u003eПеред завершением смены\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\"checklist\" id=\"checkEnd\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"page\" id=\"page-archive\"\u003e\n      \u003cdiv class=\"page-heading\"\u003e\u003cdiv\u003e\u003ch1\u003eАрхив отчётов\u003c/h1\u003e\u003cp\u003eСохранённые передачи смены. Архив хранится локально в браузере.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton class=\"btn btn-outline\" id=\"exportData\"\u003eЭкспорт данных\u003c/button\u003e\u003cbutton class=\"btn btn-outline\" id=\"importDataBtn\"\u003eИмпорт данных\u003c/button\u003e\u003cinput type=\"file\" id=\"importDataFile\" accept=\"application/json,.json\" class=\"hidden\"\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"card\"\u003e\u003cdiv class=\"field\"\u003e\u003clabel for=\"archiveSearch\"\u003eПоиск по архиву\u003c/label\u003e\u003cinput id=\"archiveSearch\" placeholder=\"Дата, сотрудник или текст отчёта…\"\u003e\u003c/div\u003e\u003cdiv class=\"section-divider\"\u003e\u003c/div\u003e\u003cdiv id=\"archiveList\"\u003e\u003cdiv class=\"empty\"\u003eСохранённых отчётов пока нет.\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"small-note\"\u003eСовет: периодически используйте экспорт данных, чтобы иметь резервную копию. Импорт объединяет данные с текущими по уникальным идентификаторам.\u003c/div\u003e\n    \u003c/section\u003e\n  \u003c/div\u003e\n\u003c/main\u003e\n\u003cnav class=\"mobile-nav\" aria-label=\"Навигация\"\u003e\n  \u003cbutton class=\"nav-btn active\" data-page=\"home\"\u003e\u003cspan class=\"nav-icon\"\u003e⌂\u003c/span\u003e\u003cspan\u003eГлавная\u003c/span\u003e\u003c/button\u003e\n  \u003cbutton class=\"nav-btn\" data-page=\"report\"\u003e\u003cspan class=\"nav-icon\"\u003e▤\u003c/span\u003e\u003cspan\u003eПередача\u003c/span\u003e\u003c/button\u003e\n  \u003cbutton class=\"nav-btn\" data-page=\"tasks\"\u003e\u003cspan class=\"nav-icon\"\u003e✓\u003c/span\u003e\u003cspan\u003eЗадачи\u003c/span\u003e\u003c/button\u003e\n  \u003cbutton class=\"nav-btn\" data-page=\"guests\"\u003e\u003cspan class=\"nav-icon\"\u003e✉\u003c/span\u003e\u003cspan\u003eГости\u003c/span\u003e\u003c/button\u003e\n  \u003cbutton class=\"nav-btn\" data-page=\"archive\"\u003e\u003cspan class=\"nav-icon\"\u003e▣\u003c/span\u003e\u003cspan\u003eАрхив\u003c/span\u003e\u003c/button\u003e\n\u003c/nav\u003e\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n(() =\u003e {\n'use strict';\nconst $ = id =\u003e document.getElementById(id);\nconst STORE = 'hotelDeskFresh_v1';\nconst reportFields = ['reportDate','shiftType','fromName','toName','occupancy','arrivals','important','guestIssues','pending','completedTasks','payments','otherNotes'];\nconst titles = {home:'Главная',report:'Передача смены',tasks:'Задачи',templates:'Шаблоны ситуаций',guests:'Помощник по гостям',checklist:'Чек-лист',archive:'Архив отчётов'};\nconst today = () =\u003e { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };\nconst uid = () =\u003e `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;\nconst esc = s =\u003e String(s ?? '').replace(/[\u0026\u003c\u003e\"']/g, c=\u003e({'\u0026':'\u0026amp;','\u003c':'\u0026lt;','\u003e':'\u0026gt;','\"':'\u0026quot;',\"'\":'\u0026#39;'}[c]));\nlet toastTimer;\nfunction toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=\u003eel.classList.remove('show'),2600);}\nfunction safeParse(s, fallback){try{return JSON.parse(s)||fallback}catch{return fallback}}\nlet data = safeParse(localStorage.getItem(STORE), {tasks:[],reports:[],checklist:{},draft:{},lastPreview:''});\nif(!Array.isArray(data.tasks))data.tasks=[];\nif(!Array.isArray(data.reports))data.reports=[];\nif(!data.checklist || typeof data.checklist!=='object')data.checklist={};\nif(!data.draft || typeof data.draft!=='object')data.draft={};\nfunction persist(){try{localStorage.setItem(STORE,JSON.stringify(data));}catch(e){toast('Не удалось сохранить данные: возможно, заполнено хранилище браузера.');}}\nfunction showPage(key){\n if(!titles[key])return;\n document.querySelectorAll('.page').forEach(p=\u003ep.classList.toggle('active',p.id===`page-${key}`));\n document.querySelectorAll('[data-page]').forEach(b=\u003eb.classList.tog  v.completedTasks.trim()||'Отдельно выполненные задачи не указаны.',\n '',\n 'ОПЛАТЫ, ДОКУМЕНТЫ И ПРОЧЕЕ',\n v.payments.trim()||'Нет дополнительных сведений.',\n '',\n 'ДОПОЛНИТЕЛЬНЫЕ ЗАМЕТКИ',\n v.otherNotes.trim()||'Нет дополнительных заметок.'\n ];\n return lines.join('\\n');\n}\nfunction generate(){data.lastPreview=makeReport();$('reportPreview').textContent=data.lastPreview;$('reportStatus').textContent='Готов к передаче';persist();toast('Отчёт сформирован');}\n$('generateReport').addEventListener('click',generate);\n$('saveReport').addEventListener('click',()=\u003e{\n const text=$('reportPreview').textContent.includes('Заполните форму')?makeReport():$('reportPreview').textContent;\n const v=readDraft();\n const item={id:uid(),createdAt:new Date().toISOString(),date:v.reportDate||today(),shift:v.shiftType||'',from:v.fromName||'',to:v.toName||'',text};\n data.reports.unshift(item);data.lastPreview=text;persist();renderArchive();renderHome();updateStats();toast('Отчёт сохранён в архив');\n});\n$('copyReport').addEventListener('click',async()=\u003e{const text=$('reportPreview').textContent.includes('Заполните форму')?makeReport():$('reportPreview').textContent;await copyText(text);});\n$('printReport').addEventListener('click',()=\u003e{if(!$('reportPreview').textContent.includes('Заполните форму'))window.print();else{generate();setTimeout(()=\u003ewindow.print(),100);}});\n$('clearReport').addEventListener('click',()=\u003e{if(!confirm('Очистить все поля передачи смены?'))return;reportFields.forEach(id=\u003e$(id).value=id==='reportDate'?today():id==='shiftType'?'Утренняя смена':'');saveDraft();$('reportPreview').textContent='Заполните форму и нажмите «Сформировать отчёт».';$('reportStatus').textContent='Черновик';toast('Форма очищена');});\nasync function copyText(text){try{if(navigator.clipboard\u0026\u0026window.isSecureContext){await navigator.clipboard.writeText(text);}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed' on\u003e\u003coption value=\"booked\"\u003eТолько занятые\u003c/option\u003e\u003coption value=\"free\"\u003eТолько свободные\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton class=\"btn primary\" id=\"print\"\u003e▤ Печать расписания\u003c/button\u003e\u003cbutton class=\"btn outline\" id=\"export\"\u003e↓ Резервная копия\u003c/button\u003e\u003cbutton class=\"btn outline\" id=\"import\"\u003e↑ Импорт\u003c/button\u003e\u003cinput id=\"file\" class=\"hidden\" type=\"file\" accept=\"application/json,.json\"\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"notice\"\u003e\u003cb\u003eПравило расписания:\u003c/b\u003e каждая сторона ведётся отдельно. Посещение — 1 час, затем 1 час на уборку. Между началами записей одной стороны должно быть не менее 2 часов. Режим работы — 10:00–21:00; время начала можно выбрать с 10:00 до 20:00.\u003c/div\u003e\n\u003cdiv class=\"stats\"\u003e\u003cdiv class=\"stat\"\u003e\u003cspan\u003eЗаписей на выбранную дату\u003c/span\u003e\u003cstrong id=\"total\"\u003e0\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"stat\"\u003e\u003cspan\u003eМужская сторона\u003c/span\u003e\u003cstrong id=\"mc\"\u003e0\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"stat\"\u003e\u003cspan\u003eЖенская сторона\u003c/span\u003e\u003cstrong id=\"fc\"\u003e0\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"zones\"\u003e\u003csection class=\"zone\"\u003e\u003cdiv class=\"zonehead\"\u003e\u003cdiv\u003e\u003ch2\u003e♀ Женская сторона\u003c/h2\u003e\u003cp\u003eСауна и хаммам · отдельное расписание\u003c/p\u003e\u003c/div\u003e\u003cspan class=\"count\" id=\"fcount\"\u003e0 записей\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"slots\" id=\"female\"\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"zone\"\u003e\u003cdiv class=\"zonehead\"\u003e\u003cdiv\u003e\u003ch2\u003e♂ Мужская сторона\u003c/h2\u003e\u003cp\u003eСауна и хаммам · отдельное распи function injectHeightReporter(source,app){
  const reporter='<script>(function(){const send=function(){try{parent.postMessage({type:"unified-app-height",app:"'+app+'",height:Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0)},"*")}catch(e){}};window.addEventListener("load",function(){send();setTimeout(send,150);setTimeout(send,700)});window.addEventListener("resize",send);if(window.ResizeObserver){new ResizeObserver(send).observe(document.documentElement)}})();<\/script>';
  const idx=source.toLowerCase().lastIndexOf('</body>');
  return idx>=0?source.slice(0,idx)+reporter+source.slice(idx):source+reporter;
}
Object.keys(frames).forEach(function(key){frames[key].srcdoc=documents[key];});
function activate(key){Object.keys(frames).forEach(function(k){const active=k===key;frames[k].hidden=!active;const btn=document.querySelector('[data-app="'+k+'"]');btn.classList.toggle('active',active);btn.setAttribute('aria-selected',String(active));});document.title=names[key]+' — Hotel Desk';try{history.replaceState(null,'','#'+key)}catch(e){}}
document.querySelectorAll('[data-app]').forEach(function(btn){btn.addEventListener('click',function(){activate(btn.dataset.app);window.scrollTo({top:0,behavior:'smooth'});});});
const initial=location.hash.replace('#','');if(frames[initial])activate(initial);
})();

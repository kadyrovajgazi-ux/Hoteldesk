function decodeDocument(value){return decodeURIComponent(Array.prototype.map.call(atob(value),function(c){return "%"+c.charCodeAt(0).toString(16).padStart(2,"0")}).join(""));}
const documents={hotel:decodeDocument(encodedDocuments.hotel),spa:decodeDocument(encodedDocuments.spa),airport:decodeDocument(encodedDocuments.airport)};
const names={hotel:'Hotel Desk',spa:'SPA Desk',airport:'Airport Calculator'};
const frames={hotel:document.getElementById('frame-hotel'),spa:document.getElementById('frame-spa'),airport:document.getElementById('frame-airport')};
function injectHeightReporter(source,app){
  const reporter='<script>(function(){const send=function(){try{parent.postMessage({type:"unified-app-height",app:"'+app+'",height:Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0)},"*")}catch(e){}};window.addEventListener("load",function(){send();setTimeout(send,150);setTimeout(send,700)});window.addEventListener("resize",send);if(window.ResizeObserver){new ResizeObserver(send).observe(document.documentElement)}})();<\/script>';
  const idx=source.toLowerCase().lastIndexOf('</body>');
  return idx>=0?source.slice(0,idx)+reporter+source.slice(idx):source+reporter;
}
Object.keys(frames).forEach(function(key){frames[key].srcdoc=documents[key];});
function activate(key){Object.keys(frames).forEach(function(k){const active=k===key;frames[k].hidden=!active;const btn=document.querySelector('[data-app="'+k+'"]');btn.classList.toggle('active',active);btn.setAttribute('aria-selected',String(active));});document.title=names[key]+' — Hotel Desk';try{history.replaceState(null,'','#'+key)}catch(e){}}
document.querySelectorAll('[data-app]').forEach(function(btn){btn.addEventListener('click',function(){activate(btn.dataset.app);window.scrollTo({top:0,behavior:'smooth'});});});
const initial=location.hash.replace('#','');if(frames[initial])activate(initial);
})();
